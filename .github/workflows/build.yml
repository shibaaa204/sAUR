name: Build & Release Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'JSON array of packages to build'
        required: false
        default: '[]'

permissions:
  contents: write

env:
  REPO_NAME: "sAUR"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup builder user & disable debug packages
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo github-cli jq curl

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # Tắt sinh gói debug trong makepkg.conf
          sed -i 's/\bdebug\b/!debug/g' /etc/makepkg.conf

          # Cài yay-bin để tự xử lý dependency AUR
          su builder -c '
            cd /tmp
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm
            rm -rf /tmp/yay-bin
          '

      - name: Download existing database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /repo

          # Tải trực tiếp file database cũ bằng curl (tránh lỗi pattern match của gh release)
          DB_URL="https://github.com/${{ github.repository }}/releases/download/packages/${REPO_NAME}.db.tar.gz"
          FILES_URL="https://github.com/${{ github.repository }}/releases/download/packages/${REPO_NAME}.files.tar.gz"

          curl -fsSL "$DB_URL" -o "/repo/${REPO_NAME}.db.tar.gz" || echo "Chưa có database cũ, sẽ khởi tạo mới."
          curl -fsSL "$FILES_URL" -o "/repo/${REPO_NAME}.files.tar.gz" || true

          # Tạo symlink tương ứng nếu tải thành công file .tar.gz
          if [ -f "/repo/${REPO_NAME}.db.tar.gz" ]; then
            ln -sf "${REPO_NAME}.db.tar.gz" "/repo/${REPO_NAME}.db"
          fi
          if [ -f "/repo/${REPO_NAME}.files.tar.gz" ]; then
            ln -sf "${REPO_NAME}.files.tar.gz" "/repo/${REPO_NAME}.files"
          fi

          chown -R builder:builder /repo

      - name: Build packages
        run: |
          INPUT_PKGS='${{ github.event.inputs.packages }}'
          if [ -n "$INPUT_PKGS" ] && [ "$INPUT_PKGS" != "[]" ]; then
            echo "$INPUT_PKGS" | jq -r '.[]' > /tmp/pkg_list.txt
          else
            grep -v '^[[:space:]]*#' packages.txt | grep -v '^[[:space:]]*$' > /tmp/pkg_list.txt || true
          fi

          mkdir -p /build
          chown -R builder:builder /build /repo /tmp/pkg_list.txt

          cat << 'EOF' > /build/run_build.sh
          #!/usr/bin/env bash
          set -e

          while IFS= read -r pkg || [ -n "$pkg" ]; do
            [ -z "$pkg" ] && continue
            echo "::group::Building $pkg"

            cd /build
            yay -S --aur --noconfirm --needed --rebuild --builddir /build "$pkg"

            # Chỉ copy các gói chính vừa build vào /repo, bỏ qua gói debug
            find /build -type f -name '*.pkg.tar.zst' ! -name '*-debug-*.pkg.tar.zst' -exec cp -u {} /repo/ \;
            echo "::endgroup::"
          done < /tmp/pkg_list.txt
          EOF

          chmod +x /build/run_build.sh
          su builder -c "/build/run_build.sh"

      - name: Update repository database
        run: |
          cd /repo
          rm -f *-debug-*.pkg.tar.zst

          # Tìm các gói mới vừa được copy vào /repo trong lần chạy này
          NEW_PKGS=$(ls *.pkg.tar.zst 2>/dev/null || true)

          if [ -n "$NEW_PKGS" ]; then
            echo "Cập nhật database với các gói mới: $NEW_PKGS"
            # repo-add sẽ thêm/cập nhật các gói mới vào database hiện có mà không làm mất các gói cũ
            repo-add -R "${REPO_NAME}.db.tar.gz" $NEW_PKGS
          fi

          # Dọn dẹp file backup .old để tránh upload thừa
          rm -f /repo/*.old

      - name: Clean up outdated package assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /repo
          ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/packages --jq '.assets.[].name' 2>/dev/null || echo "")

          for new_pkg in *.pkg.tar.zst; do
            [ -f "$new_pkg" ] || continue

            pkgname=$(echo "$new_pkg" | sed -E 's/-[^-]+-[0-9]+-[^-]+\.pkg\.tar\.zst$//')

            for asset in $ASSETS; do
              if [[ "$asset" =~ ^${pkgname}-.*\.pkg\.tar\.zst$ ]] && [ "$asset" != "$new_pkg" ]; then
                echo "Xóa asset phiên bản cũ: $asset"
                gh release delete-asset packages "$asset" --yes || true
              fi
            done
          done

      - name: Upload packages & database to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages
          name: "Packages Repository"
          files: /repo/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

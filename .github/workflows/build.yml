name: Build & Release Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'JSON array of packages to build'
        required: false
        default: '[]'

permissions:
  contents: write

env:
  REPO_NAME: "sAUR"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup builder user & disable debug packages
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo github-cli jq

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # Tắt sinh gói debug trong makepkg.conf
          sed -i 's/\bdebug\b/!debug/g' /etc/makepkg.conf

          # Cài yay-bin để tự xử lý dependency AUR
          su builder -c '
            cd /tmp
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm
            rm -rf /tmp/yay-bin
          '

      - name: Download existing repository files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /repo

          # Tải database cũ về trước để giữ metadata
          gh release download packages -p "${REPO_NAME}.db.tar.gz" -D /repo --clobber || true
          gh release download packages -p "${REPO_NAME}.files.tar.gz" -D /repo --clobber || true

          # Tải toàn bộ packages hiện có trên Release về /repo
          gh release download packages -p "*.pkg.tar.zst" -D /repo --clobber || true

          # Xóa các file debug cũ nếu có lọt vào
          rm -f /repo/*-debug-*.pkg.tar.zst

          echo "::group::Existing assets in /repo before build"
          ls -la /repo
          echo "::endgroup::"

          chown -R builder:builder /repo

      - name: Build packages
        run: |
          INPUT_PKGS='${{ github.event.inputs.packages }}'
          if [ -n "$INPUT_PKGS" ] && [ "$INPUT_PKGS" != "[]" ]; then
            echo "$INPUT_PKGS" | jq -r '.[]' > /tmp/pkg_list.txt
          else
            grep -v '^[[:space:]]*#' packages.txt | grep -v '^[[:space:]]*$' > /tmp/pkg_list.txt || true
          fi

          mkdir -p /build
          chown -R builder:builder /build /repo /tmp/pkg_list.txt

          cat << 'EOF' > /build/run_build.sh
          #!/usr/bin/env bash
          set -e

          while IFS= read -r pkg || [ -n "$pkg" ]; do
            [ -z "$pkg" ] && continue
            echo "::group::Building $pkg"

            cd /build
            yay -S --aur --noconfirm --needed --rebuild --builddir /build "$pkg"

            # Thu thập các file gói chính vào /repo, bỏ qua gói debug
            find /build -type f -name '*.pkg.tar.zst' ! -name '*-debug-*.pkg.tar.zst' -exec cp -u {} /repo/ \;
            echo "::endgroup::"
          done < /tmp/pkg_list.txt
          EOF

          chmod +x /build/run_build.sh
          su builder -c "/build/run_build.sh"

      - name: Update repository database
        run: |
          cd /repo
          rm -f *-debug-*.pkg.tar.zst

          if ls *.pkg.tar.zst 1> /dev/null 2>&1; then
            # Quét toàn bộ các gói hiện có trong /repo để nạp vào database
            repo-add -R "${REPO_NAME}.db.tar.gz" *.pkg.tar.zst
          fi

          # Dọn sạch các file backup .old do repo-add sinh ra để không bị upload lên Release
          rm -f /repo/*.old

      - name: Clean up outdated package assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /repo
          ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/packages --jq '.assets.[].name' 2>/dev/null || echo "")

          # Duyệt qua các gói có trong /repo để xóa các asset cũ hơn trên Release
          for new_pkg in *.pkg.tar.zst; do
            [ -f "$new_pkg" ] || continue

            # Tách lấy tên package gốc (loại bỏ -version-pkgrel-arch.pkg.tar.zst)
            pkgname=$(echo "$new_pkg" | sed -E 's/-[^-]+-[0-9]+-[^-]+\.pkg\.tar\.zst$//')

            for asset in $ASSETS; do
              if [[ "$asset" =~ ^${pkgname}-.*\.pkg\.tar\.zst$ ]] && [ "$asset" != "$new_pkg" ]; then
                echo "Xóa asset phiên bản cũ: $asset"
                gh release delete-asset packages "$asset" --yes || true
              fi
            done
          done

      - name: Upload packages & database to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages
          name: "Packages Repository"
          files: /repo/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

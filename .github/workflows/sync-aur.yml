name: Check & Sync AUR Updates

on:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches:
      - main
    paths:
      - 'packages.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare AUR upstream versions with GitHub Release assets
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_FILES=$(gh api repos/${{ github.repository }}/releases/tags/packages --jq '.assets.[].name' 2>/dev/null || echo "")
          PACKAGES_TO_BUILD=()

          while IFS= read -r pkg || [ -n "$pkg" ]; do
            [[ -z "$pkg" || "$pkg" =~ ^# ]] && continue

            echo "Checking: $pkg"
            AUR_INFO=$(curl -s "https://aur.archlinux.org/rpc/v5/info?arg[]=${pkg}")
            AUR_VER=$(echo "$AUR_INFO" | jq -r '.results[0].Version // empty')

            if [ -z "$AUR_VER" ]; then
              echo "  [Warning] Package '$pkg' not found on AUR."
              continue
            fi

            echo "  Upstream Version: $AUR_VER"

            MATCH_FOUND=false
            while IFS= read -r asset; do
              if [[ "$asset" =~ ^${pkg}-${AUR_VER}-.*\.pkg\.tar\.zst$ ]]; then
                MATCH_FOUND=true
                break
              fi
            done <<< "$RELEASE_FILES"

            if [ "$MATCH_FOUND" = true ]; then
              echo "  -> Up-to-date. Skipping."
            else
              echo "  -> Update required. Added to queue."
              PACKAGES_TO_BUILD+=("$pkg")
            fi
          done < packages.txt

          if [ ${#PACKAGES_TO_BUILD[@]} -gt 0 ]; then
            PKGS_JSON=$(jq -nc --args '$ARGS.positional' -- "${PACKAGES_TO_BUILD[@]}")
            echo "pkgs=$PKGS_JSON" >> "$GITHUB_OUTPUT"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Queue: ${PACKAGES_TO_BUILD[*]}"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "All packages are up-to-date."
          fi

      - name: Trigger Build Workflow
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pkgs = ${{ steps.check.outputs.pkgs }};
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                packages: JSON.stringify(pkgs)
              }
            });
